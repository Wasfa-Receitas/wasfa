<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="../css/loginstyle.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>

<header>
      <nav class="navbar">
        <a href="../index.html"><img src="../assets/img/wasfalogo.png" alt="Wasfa" class="logo-img"></a>
        <ul class="navlist">
          <li class="nav-item"><a class="nav-link" href="../index.html">Início</a></li>
          <li class="nav-item"><a class="nav-link" href="./receitas.html">Receitas</a></li>
          <li class="nav-item"><a class="nav-link" href="./sobre.html">Sobre</a></li>
          <li class="nav-item"><a class="nav-link" href="./contato.html">Contato</a></li>
        </ul>

        <button class="menu-toggle" id="menuToggle"><i class="fa-solid fa-bars"></i></button>
      </nav>
      <nav class="nav-mobile">
        <ul class="navlist-mobile">
          <li class="nav-item-mobile"><a href="../index.html" class="nav-link-mobile">Inicio</a></li>
          <li class="nav-item-mobile"><a href="./receitas.html" class="nav-link-mobile">Receitas</a></li>
          <li class="nav-item-mobile"><a href="./sobre.html" class="nav-link-mobile">Sobre</a></li>
          <li class="nav-item-mobile"><a href="./contato.html" class="nav-link-mobile">Contato</a></li>
        </ul>
      </nav>
    </header>
<main>

<div class="cadastro-container">

    <div class="cadastro-box">

        <div class="auth-toggle">
            <button id="btn-login-tab" class="active">Entrar</button>
            <button id="btn-signup-tab">Criar Conta</button>
            <button id="btn-logout" style="display:none;">Sair</button>
        </div>

        <div class="auth-forms">

            <form id="login-form" class="auth-form active">

                <h1 class="cadastro-title">Entrar</h1>

                <div class="input-group">
                    <label>Email</label>
                    <input placeholder="Insira seu email" id="login-email" required>
                </div>

                <div class="input-group">
                    <label>Senha</label>
                    <input placeholder="Insira sua senha" type="password" id="login-password" required>
                </div>

                <button type="submit" class="btn-cadastro">Entrar</button>
            </form>

            <form id="signup-form" class="auth-form">

                <h1 class="cadastro-title">Criar conta</h1>

                <div class="input-group">
                    <label>Nome</label>
                    <input placeholder="Insira seu nome" id="signup-name" required>
                </div>

                <div class="input-group">
                    <label>Email</label>
                    <input placeholder="Insira seu email" id="signup-email" required>
                </div>

                <div class="input-group">
                    <label>Senha</label>
                    <input placeholder="Crie uma senha" type="password" id="signup-password" required>
                </div>

                <div class="input-group">
                    <label>Confirmar senha</label>
                    <input placeholder="Confirme sua senha" type="password" id="signup-password-confirm" required>
                </div>

                <button type="submit" class="btn-cadastro">Cadastrar</button>
            </form>

        </div>

    </div>

</div>

</main>
<footer>
      <img src="../assets/img/wasfalogo.png" alt="Wasfa" width="500" class="logo-footer">
      <div class="desenvolvedores">
        <h3>Equipe Wasfa</h3>
        <ul>
          <li>Anny</li>
          <li>Isabelly</li>
          <li>Kaue</li>
          <li>Natasha</li>
          <li>Samuel</li>
          <li>Yago</li>
      </div>
      <div class="rights-reserved"><p class="footer-text">© 2026 Wasfa. Todos os direitos reservados.</p></div>
    </footer>

<script type="module" src="../js/dist/script.js"></script>
<script type="module" src="../js/dist/loginscript.js"></script>

</body>
</html>
